<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="theme-color" content="#111">
<title>Habits</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#fff;font:16px -apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 90px)}
h1{font-size:28px;margin:8px 0 4px}
.sub{color:#888;margin-bottom:16px}
.bar{height:8px;background:#222;border-radius:4px;overflow:hidden;margin-bottom:20px}
.bar div{height:100%;background:#4ade80;transition:width .3s}
.h{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;margin-bottom:10px;background:var(--c);opacity:.55;transition:opacity .2s}
.h.done{opacity:1}
.h .n{flex:1;font-weight:600}
.h .s{font-size:13px;opacity:.85;font-weight:400}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:#fff}
.chk{width:36px;height:36px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:20px;flex:none}
.del{background:none;border:none;color:#fff;font-size:18px;opacity:.6;padding:4px}
.add{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:8px}
.add input{flex:1;padding:14px;border-radius:14px;border:none;background:#222;color:#fff;font-size:16px}
.add button{padding:0 18px;border-radius:14px;border:none;background:#fff;color:#111;font-weight:700;font-size:16px}
.empty{color:#666;text-align:center;margin-top:60px}
</style>
</head>
<body>
<h1>Today</h1>
<div class="sub" id="sub"></div>
<div class="bar"><div id="prog"></div></div>
<div id="list"></div>
<form class="add" id="f"><input id="name" placeholder="New habit…" autocomplete="off"><button>Add</button></form>
<script>
const COLORS=['#ef4444','#3b82f6','#22c55e','#a855f7','#f97316','#06b6d4','#ec4899','#eab308'];
let habits=JSON.parse(localStorage.getItem('habits')||'[]');
const key=d=>d.toISOString().slice(0,10);
const day=o=>{const d=new Date();d.setHours(12);d.setDate(d.getDate()-o);return key(d)};
const save=()=>{localStorage.setItem('habits',JSON.stringify(habits));render()};
function streak(h){let s=0,o=h.done.includes(day(0))?0:1;while(h.done.includes(day(o))){s++;o++}return s}
function render(){
  const t=day(0),done=habits.filter(h=>h.done.includes(t)).length;
  sub.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+(habits.length?` · ${done}/${habits.length}`:'');
  prog.style.width=habits.length?done/habits.length*100+'%':0;
  list.innerHTML=habits.length?'':'<div class="empty">Add your first habit below</div>';
  habits.forEach((h,i)=>{
    const on=h.done.includes(t),el=document.createElement('div');
    el.className='h'+(on?' done':'');el.style.setProperty('--c',h.color);
    el.innerHTML=`<div class="chk">${on?'✓':''}</div><div class="n">${h.name.replace(/</g,'&lt;')}<div class="s">🔥 ${streak(h)} day streak</div><div class="dots">${[6,5,4,3,2,1,0].map(o=>`<i class="${h.done.includes(day(o))?'on':''}"></i>`).join('')}</div></div><button class="del">✕</button>`;
    el.onclick=()=>{on?h.done.splice(h.done.indexOf(t),1):h.done.push(t);save()};
    el.querySelector('.del').onclick=e=>{e.stopPropagation();if(confirm(`Delete "${h.name}"?`)){habits.splice(i,1);save()}};
    list.appendChild(el);
  });
}
f.onsubmit=e=>{e.preventDefault();const n=name.value.trim();if(!n)return;habits.push({name:n,color:COLORS[habits.length%COLORS.length],done:[]});name.value='';save()};
document.addEventListener('visibilitychange',render);
render();
</script>
</body>
</html>
